<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask SocketIO</title>
    <style>
        @font-face {
            font-family: 'DelaGothicOne-Regular';
            src: url('/ttf/DelaGothicOne-Regular.ttf');
        }
        @font-face {
            font-family: 'HGRSMP';
            src: url('/ttf/HGRSMP.ttf');
        }
        @font-face {
            font-family: 'KosugiMaru-Regular';
            src: url('/ttf/KosugiMaru-Regular.ttf');
        }
        @font-face {
            font-family: 'MochiyPopOne-Regular';
            src: url('/ttf/MochiyPopOne-Regular.ttf');
        }
        @font-face {
            font-family: 'PottaOne-Regular';
            src: url('/ttf/PottaOne-Regular.ttf');
        }
        @font-face {
            font-family: 'ReggaeOne-Regular';
            src: url('/ttf/ReggaeOne-Regular.ttf');
        }
        @font-face {
            font-family: 'SawarabiGothic-Regular';
            src: url('/ttf/SawarabiGothic-Regular.ttf');
        }
        @font-face {
            font-family: 'YuseiMagic-Regular';
            src: url('/ttf/YuseiMagic-Regular.ttf');
        }
        @font-face {
            font-family: 'ZenAntiqueSoft-Regular';
            src: url('/ttf/ZenAntiqueSoft-Regular.ttf');
        }
        @font-face {
            font-family: 'ZenKurenaido-Regular';
            src: url('/ttf/ZenKurenaido-Regular.ttf');
        }
        @font-face {
            font-family: 'ZenOldMincho-Regular';
            src: url('/ttf/ZenOldMincho-Regular.ttf');
        }
        .main {
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>    
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script type="text/javascript" charset="utf-8">
        document.addEventListener("DOMContentLoaded", () => {
            const socket = io();
            const subtitles = [];
            const textArea = document.getElementById('text-area');
            textArea.innerText = '読み込み中...';

            setupSocketEvents(socket);
        });

        /**
         * Socket.IO のイベントリスナーを設定
         * @param {Socket} socket
         */
        function setupSocketEvents(socket) {
            socket.on('connect', () => {
                console.log('Connected to server');
                socket.emit('get_subtitles');
            });

            socket.on('update_subtitles', (data) => {
                console.log('Received subtitle data:', data);
                updateSubtitles(data);
            });
        }

        /**
         * 字幕データを更新
         * @param {Object} subtitle
         */
        function updateSubtitles(subtitle) {
            const textArea = document.getElementById('text-area');
            //textArea.innerHTML = '';

            const subtitleElement = createSubtitleElement(subtitle);
            textArea.appendChild(subtitleElement);
        }

        /**
         * 字幕要素を作成
         * @param {Object} subtitle
         * @returns {HTMLDivElement} 字幕の親 div 要素
         */
        function createSubtitleElement(subtitle) {
            const div = document.createElement('div');
            div.id = "subtitle-" + subtitle.index;

            const text = document.createElement('div');
            text.className = 'text';
            div.appendChild(text);

            const eng = document.createElement('div');
            eng.className = 'eng';
            eng.style.fontFamily = subtitle.font;
            eng.style.fontSize = subtitle.size + 'px';
            eng.innerText = subtitle.eng;
            div.appendChild(eng);

            subtitle.words.forEach((word) => {
                text.appendChild(createWordElement(word));
            });

            return div;
        }

        /**
         * 日本語字幕の単語要素を作成
         * @param {Object} word
         * @returns {HTMLSpanElement} 単語の span 要素
         */
        function createWordElement(word) {
            const span = document.createElement('span');
            span.innerText = word.text;
            span.style.color = word.color;
            span.style.fontFamily = word.font;
            span.style.fontSize = word.size + 'px';
            return span;
        }
    </script>
</head>
<body>
    <div class="main">
        <div id="text-area"></div>
    </div>
</body>
</html>
